<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f6" />
    <meta name="description" content="Manage your private identity on Stellar." />
    <title>Stello · Identity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Stello"><span class="brand-icon">s</span>stello</a>
      <div class="top-right"><span class="network"><i></i> Stellar Testnet</span><button id="connect" class="button button-dark">Connect wallet</button></div>
    </header>
    <main>
      <div class="page-heading"><div><div class="eyebrow">IDENTITY</div><h1>Your identity</h1></div></div>
      <section class="identity-card" aria-labelledby="identity-title">
        <div class="card-top"><div class="shield">◇</div><div id="identity-state" class="state"><i></i><span>Not verified</span></div></div>
        <h2 id="identity-title">Private identity verification</h2>
        <p class="card-copy">Verify your eligibility without sharing personal information on-chain.</p>
        <div class="rule"></div>
        <div class="fields"><div><span>Wallet</span><strong id="wallet-address">Not connected</strong></div><div><span>Network</span><strong>Stellar Testnet</strong></div></div>
        <button id="verify" class="button button-green" disabled>Verify identity <span>→</span></button>
        <p class="setup-note" id="setup-note">Connect a wallet to continue.</p>
      </section>
      <footer><span>Stello</span><a href="https://stellar.org" target="_blank" rel="noreferrer">Stellar ↗</a></footer>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://unpkg.com/@stellar/freighter-api@6.0.1/build/index.min.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
